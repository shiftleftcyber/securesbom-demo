name: SecureSBOM Demo - Digest Signing CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # --------------------------------------------------
  # 1️⃣ Build & Test
  # --------------------------------------------------
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test with Maven
        run: mvn -B clean verify -DskipTests
        shell: bash

      - name: Upload Build Artifacts (for next stage)
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: target/

      - name: Add Job Summary
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Maven project built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts uploaded for SBOM generation" >> $GITHUB_STEP_SUMMARY


  # --------------------------------------------------
  # 2️⃣ Generate SBOM
  # --------------------------------------------------
  generate-sbom:
    name: 📦 Generate SBOM
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: target/

      - name: Generate SBOM (CycloneDX)
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -DoutputFormat=JSON \
            -DschemaVersion=1.6 \
            -DoutputName=demo-app.1.0.0.cdx
          echo "Generated SBOM:"
        shell: bash

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: generated-sbom
          path: target/demo-app.1.0.0.cdx.json

      - name: Add Job Summary
        run: |
          echo "### 📦 SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "- CycloneDX SBOM created for build artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded as artifact [generated-sbom]" >> $GITHUB_STEP_SUMMARY


  # --------------------------------------------------
  # 3️⃣ Sign SBOM Digest
  # --------------------------------------------------
  sign-digest:
    name: 🔏 Sign SBOM Digest
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download Generated SBOM
        uses: actions/download-artifact@v8
        with:
          name: generated-sbom

      - name: Generate Digest
        id: digest
        run: |
          digest="$(openssl dgst -sha256 -binary demo-app.1.0.0.cdx.json | base64 | tr -d '\n')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$digest" > digest.txt
          echo "digest is: $digest"
        
      - name: Sign Digest 
        uses: shiftleftcyber/secure-sbom-action@v2
        with:
          digest: ${{ steps.digest.outputs.digest }}
          digest_hash_algorithm: "sha256"
          secure_sbom_action: sign_digest
          secure_sbom_api_key: ${{ secrets.SECURE_SBOM_API_KEY }}
          secure_sbom_signing_key_id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}

      - name: Upload Digest Payload
        uses: actions/upload-artifact@v7
        with:
          name: signed-digest-payload
          path: |
            signed-digest-*.json
            digest.txt
          if-no-files-found: error

      - name: Add Job Summary
        run: |
          echo "### 🔏 SBOM Digest Signed" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Digest signed using SecureSBOM API" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------
  # ✅ Verify SBOM Digest (offline)
  # --------------------------------------------------
  verify-digest:
    name: ✅ Verify SBOM Digest (offline)
    runs-on: ubuntu-latest
    needs: sign-digest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download Digest Package
        uses: actions/download-artifact@v8
        with:
          name: signed-digest-payload
    
      - name: Download Generated SBOM
        uses: actions/download-artifact@v8
        with:
            name: generated-sbom
    
      - name: Extract raw signature
        run: |
          mkdir -p securesbom
          jq -r '.signature' signed-digest-*.json | base64 --decode > securesbom/sig.der
        
      - name: Download public key
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "${{ vars.SECURE_SBOM_API_URL }}/api/v1/keys/public?key_id=${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}&format=pem" \
            --header "x-api-key: ${{ secrets.SECURE_SBOM_API_KEY }}" \
            -o securesbom/pubkey.pem

      - name: Verify Digest
        id: verify
        run: |
          openssl dgst -sha256 \
            -verify securesbom/pubkey.pem \
            -signature securesbom/sig.der \
            demo-app.1.0.0.cdx.json

      # --------------------------------------------------
      # Optional: Enforce Security Gate
      # --------------------------------------------------
      - name: Enforce Security Gate (Fail if invalid)
        if: steps.verify.outcome != 'success'
        run: |
          echo "❌ DIGEST Verification Failed - Blocking Deployment"
          exit 1

      - name: Add Job Summary
        if: steps.verify.outcome == 'success'
        run: |
          echo "### ✅ SecureSBOM Demo: Verify Digest SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- DIGEST verified successfully using SecureSBOM Offline Verification" >> $GITHUB_STEP_SUMMARY
          echo "- Integrity and authenticity confirmed ✅" >> $GITHUB_STEP_SUMMARY
