name: SecureSBOM Demo - Multi-Stage CI/CD (Maven)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # --------------------------------------------------
  # 1️⃣ Build & Test
  # --------------------------------------------------
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test with Maven
        run: mvn -B clean verify -DskipTests
        shell: bash

      - name: Upload Build Artifacts (for next stage)
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: target/

      - name: Add Job Summary
        run: |
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Maven project built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts uploaded for SBOM generation" >> $GITHUB_STEP_SUMMARY


  # --------------------------------------------------
  # 2️⃣ Generate SBOM
  # --------------------------------------------------
  generate-sbom:
    name: 📦 Generate SBOM
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: target/

      - name: Generate SBOM (CycloneDX)
        run: |
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -DoutputFormat=JSON \
            -DschemaVersion=1.6 \
            -DoutputName=demo-app.1.0.0.cdx
          echo "Generated SBOM:"
        shell: bash

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: generated-sbom
          path: target/demo-app.1.0.0.cdx.json

      - name: Add Job Summary
        run: |
          echo "### 📦 SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "- CycloneDX SBOM created for build artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded as artifact [generated-sbom]" >> $GITHUB_STEP_SUMMARY


  # --------------------------------------------------
  # 3️⃣ Sign SBOM
  # --------------------------------------------------
  sign-sbom:
    name: 🔏 Sign SBOM
    runs-on: ubuntu-latest
    needs: generate-sbom

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download Generated SBOM
        uses: actions/download-artifact@v8
        with:
          name: generated-sbom

      - name: Sign SBOM
        uses: shiftleftcyber/secure-sbom-action@v2.2.0
        with:
          sbom_file: demo-app.1.0.0.cdx.json
          secure_sbom_action: sign_sbom
          secure_sbom_api_key: ${{ secrets.SECURE_SBOM_API_KEY }}
          secure_sbom_signing_key_id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}

      - name: Upload Signed SBOM
        uses: actions/upload-artifact@v7
        with:
          name: signed-sbom
          path: demo-app.1.0.0.cdx.signed.json

      - name: Add Job Summary
        run: |
          echo "### 🔏 SBOM Signed" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM signed using SecureSBOM API" >> $GITHUB_STEP_SUMMARY
          echo "- Signed artifact uploaded [signed-sbom]" >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------
  # ✅ Verify Signed SBOM
  # --------------------------------------------------
  verify-sbom:
    name: ✅ Verify Signed SBOM
    runs-on: ubuntu-latest
    needs: sign-sbom

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download Signed SBOM
        uses: actions/download-artifact@v8
        with:
          name: signed-sbom

      - name: Verify SBOM
        id: verify
        uses: shiftleftcyber/secure-sbom-action@v2.2.0
        with:
          sbom_file: demo-app.1.0.0.cdx.signed.json
          secure_sbom_action: verify_sbom
          secure_sbom_api_key: ${{ secrets.SECURE_SBOM_API_KEY }}
          secure_sbom_signing_key_id: ${{ vars.SECURE_SBOM_SIGNING_KEY_ID }}

      # --------------------------------------------------
      # Optional: Enforce Security Gate
      # --------------------------------------------------
      - name: Enforce Security Gate (Fail if invalid)
        if: steps.verify.outcome != 'success'
        run: |
          echo "❌ SBOM Verification Failed - Blocking Deployment"
          exit 1

      - name: Add Job Summary
        if: steps.verify.outcome == 'success'
        run: |
          echo "### ✅ SecureSBOM Demo: Verify Signed SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM verified successfully using SecureSBOM" >> $GITHUB_STEP_SUMMARY
          echo "- Integrity and authenticity confirmed ✅" >> $GITHUB_STEP_SUMMARY